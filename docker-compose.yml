name: stegolab
x-common: &common
  image: stegolab:local
  build:
    context: .
    target: runtime
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  restart: unless-stopped
  volumes:
    - stegolab-data:/data
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
  environment: &environment
    STEGOLAB_DATA_DIR: /data
    STEGOLAB_MAX_FILE_MB: ${STEGOLAB_MAX_FILE_MB:-32}
    STEGOLAB_MAX_STORAGE_MB: ${STEGOLAB_MAX_STORAGE_MB:-2048}
    STEGOLAB_CONCURRENCY: ${STEGOLAB_CONCURRENCY:-2}
    STEGOLAB_QUICK_TIMEOUT: ${STEGOLAB_QUICK_TIMEOUT:-90}
    STEGOLAB_DEEP_TIMEOUT: ${STEGOLAB_DEEP_TIMEOUT:-300}
services:
  web:
    <<: *common
    ports:
      - "127.0.0.1:${STEGOLAB_PORT:-8000}:8000"
    mem_limit: 384m
    cpus: 1
    pids_limit: 96
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  worker:
    <<: *common
    command: [python, -m, stegolab.worker]
    network_mode: none
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import time; from stegolab.store import Store; from stegolab.config import Settings; assert time.time()-Store(Settings()).heartbeat_time()<15"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
volumes:
  stegolab-data:
